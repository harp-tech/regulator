# =======================================================================================================================================================================
# Harp.Regulator CI/CD
# =======================================================================================================================================================================
# Index:
# * Publish app
# * Build documentation
# * Publish documentation
# =======================================================================================================================================================================
name: Harp.Regulator
on:
  push:
    # This prevents tag pushes from triggering this workflow
    branches: ['**']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish-documentation:
        description: "Publish documentation to GitHub Pages?"
        default: "false"
env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  ContinuousIntegrationBuild: true
jobs:
  # =====================================================================================================================================================================
  # Publish app
  #  ___      _    _ _    _
  # | _ \_  _| |__| (_)__| |_    __ _ _ __ _ __
  # |  _/ || | '_ \ | (_-< ' \  / _` | '_ \ '_ \
  # |_|  \_,_|_.__/_|_/__/_||_| \__,_| .__/ .__/
  #                                  |_|  |_|
  # =====================================================================================================================================================================
  publish-app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            rid: win-x64
          - name: Linux x64
            os: ubuntu-latest
            rid: linux-x64
          - name: macOS x64
            os: macos-latest
            rid: osx-x64
    name: Publish app (${{matrix.name}})
    runs-on: ${{matrix.os}}
    permissions:
      # Needed to attach files to releases
      contents: write
    steps:
      # ----------------------------------------------------------------------- Checkout
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ----------------------------------------------------------------------- Set up tools
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      # ----------------------------------------------------------------------- Configure build
      - name: Configure build
        id: configure-build
        uses: bonsai-rx/configure-build@v1

      # ----------------------------------------------------------------------- Publish self-contained
      - name: Publish app
        run: dotnet publish src/Harp.Regulator --configuration Release --runtime ${{matrix.rid}} --self-contained

      # ----------------------------------------------------------------------- Locate publish output
      - name: Locate publish output
        id: locate
        shell: bash
        run: |
          PUBLISH_DIR=$(find artifacts/publish/Harp.Regulator -maxdepth 1 -mindepth 1 -type d -name "*${{matrix.rid}}*" | head -n 1)
          if [[ -z "$PUBLISH_DIR" ]]; then
            echo "Could not locate publish output under artifacts/publish/Harp.Regulator"
            exit 1
          fi
          echo "publish-dir=$PUBLISH_DIR" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------------------- Package: Windows installer + portable ZIP
      - name: Set up NSIS
        if: matrix.rid == 'win-x64'
        run: choco install -y nsis

      - name: Parse version components
        if: matrix.rid == 'win-x64'
        id: version
        shell: bash
        run: |
          VERSION_FULL="${CiBuildVersion}"
          VERSION_BASE="${VERSION_FULL%%-*}"
          IFS=. read -r MAJOR MINOR BUILD <<< "$VERSION_BASE"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION_FULL" == *-* ]]; then
            echo "prerelease-arg=/DPRERELEASE=${VERSION_FULL#*-}" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease-arg=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build NSIS installer
        if: matrix.rid == 'win-x64'
        shell: bash
        run: |
          makensis \
            "/DVERSION_MAJOR=${{steps.version.outputs.major}}" \
            "/DVERSION_MINOR=${{steps.version.outputs.minor}}" \
            "/DVERSION_BUILD=${{steps.version.outputs.build}}" \
            "${{steps.version.outputs.prerelease-arg}}" \
            "/DARCHITECTURE=x64" \
            "/DNSIS_INPUT_DIR=${{steps.locate.outputs.publish-dir}}" \
            Harp.Regulator.nsi

      - name: Package portable ZIP (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $zip = "artifacts/Harp.Regulator.${env:CiBuildVersion}-win-x64.zip"
          Compress-Archive -Path "${{steps.locate.outputs.publish-dir}}/*" -DestinationPath $zip

      # ----------------------------------------------------------------------- Package: Linux tarball
      - name: Package tarball (Linux)
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          PUBLISH_PARENT=$(dirname "${{steps.locate.outputs.publish-dir}}")
          PUBLISH_NAME=$(basename "${{steps.locate.outputs.publish-dir}}")
          tar czf "artifacts/Harp.Regulator.${CiBuildVersion}-linux-x64.tar.gz" \
            -C "$PUBLISH_PARENT" "$PUBLISH_NAME"

      # ----------------------------------------------------------------------- Package: macOS .app zip
      - name: Package .app bundle (macOS)
        if: matrix.rid == 'osx-x64'
        shell: bash
        run: |
          APP_PATH="${{steps.locate.outputs.publish-dir}}/Harp.Regulator.app"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "Could not locate Harp.Regulator.app at $APP_PATH"
            exit 1
          fi
          ditto -c -k --keepParent "$APP_PATH" "artifacts/Harp.Regulator.${CiBuildVersion}-osx-x64.zip"

      # ----------------------------------------------------------------------- Collect artifacts
      - name: Collect artifacts
        uses: actions/upload-artifact@v4
        with:
          name: App-${{matrix.rid}}
          if-no-files-found: error
          path: |
            artifacts/Harp.Regulator.*.zip
            artifacts/Harp.Regulator.*.exe
            artifacts/Harp.Regulator.*.tar.gz

      # ----------------------------------------------------------------------- Upload release assets
      - name: Upload release assets
        if: github.event_name == 'release'
        shell: bash
        run: gh release upload --repo ${{github.repository}} ${{github.event.release.tag_name}} artifacts/Harp.Regulator.*.zip artifacts/Harp.Regulator.*.exe artifacts/Harp.Regulator.*.tar.gz --clobber
        env:
          GH_TOKEN: ${{github.token}}

  # =====================================================================================================================================================================
  # Build documentation
  #  ___      _ _    _      _                            _        _   _
  # | _ )_  _(_) |__| |  __| |___  __ _  _ _ __  ___ _ _| |_ __ _| |_(_)___ _ _
  # | _ \ || | | / _` | / _` / _ \/ _| || | '  \/ -_) ' \  _/ _` |  _| / _ \ ' \
  # |___/\_,_|_|_\__,_| \__,_\___/\__|\_,_|_|_|_\___|_||_\__\__,_|\__|_\___/_||_|
  # =====================================================================================================================================================================
  build-documentation:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      # ----------------------------------------------------------------------- Checkout
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ----------------------------------------------------------------------- Set up tools
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Set up .NET tools
        run: dotnet tool restore

      # ----------------------------------------------------------------------- Configure build
      - name: Configure build
        id: configure-build
        uses: bonsai-rx/configure-build@v1

      # ----------------------------------------------------------------------- Restore
      - name: Restore
        run: dotnet restore

      # ----------------------------------------------------------------------- Build metadata
      - name: Build metadata
        id: build-metadata
        run: dotnet docfx metadata docs/docfx.json --noRestore

      # ----------------------------------------------------------------------- Build documentation
      - name: Build documentation
        id: build-documentation
        run: dotnet docfx build docs/docfx.json

      # ----------------------------------------------------------------------- Collect artifacts
      - name: Collect documentation metadata
        uses: actions/upload-artifact@v4
        if: steps.build-metadata.outcome == 'success' && always()
        with:
          name: DocumentationMetadata
          if-no-files-found: error
          path: artifacts/docs/api/

      - name: Collect documentation artifact
        uses: actions/upload-artifact@v4
        if: steps.build-documentation.outcome == 'success' && always()
        with:
          name: DocumentationWebsite
          if-no-files-found: error
          path: artifacts/docs/site/

  # =====================================================================================================================================================================
  # Publish documentation
  #  ___      _    _ _    _         _                            _        _   _
  # | _ \_  _| |__| (_)__| |_    __| |___  __ _  _ _ __  ___ _ _| |_ __ _| |_(_)___ _ _
  # |  _/ || | '_ \ | (_-< ' \  / _` / _ \/ _| || | '  \/ -_) ' \  _/ _` |  _| / _ \ ' \
  # |_|  \_,_|_.__/_|_/__/_||_| \__,_\___/\__|\_,_|_|_|_\___|_||_\__\__,_|\__|_\___/_||_|
  # =====================================================================================================================================================================
  publish-documentation:
    name: Publish documentation
    runs-on: ubuntu-latest
    needs: [build-documentation, publish-app]
    permissions:
      pages: write
      id-token: write
    environment:
      name: documentation-website
      url: ${{steps.publish.outputs.page_url}}
    if: |
      !cancelled() && !failure() && needs.build-documentation.result == 'success'
      && (github.event_name == 'release'
        || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish-documentation == 'true')
        || (vars.CONTINUOUS_DOCUMENTATION && github.event_name != 'pull_request')
      )
    steps:
      - name: Download documentation website
        uses: actions/download-artifact@v4
        with:
          name: DocumentationWebsite

      - name: Upload final documentation website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publish to GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
